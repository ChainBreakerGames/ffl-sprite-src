name: pull-from-autosprite
on:
  push:
    paths: ['dl/*.json']
permissions:
  contents: write
jobs:
  down:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pillow
        run: pip install -q pillow
      - name: Download each URL
        run: |
          mkdir -p sheets
          for f in dl/*.json; do
            python3 - "$f" <<'PY'
          import json,sys,subprocess,os
          for it in json.load(open(sys.argv[1])):
              out='sheets/'+it['file']
              if os.path.exists(out): continue
              tmp=out+'.part' if out.endswith('.webp') else out
              r=subprocess.run(['curl','-sL','-o',tmp,'-w','%{http_code}',it['url']],capture_output=True,text=True)
              if tmp!=out:
                  try:
                      from PIL import Image
                      Image.open(tmp).save(out,'WEBP',quality=92,alpha_quality=100,method=4); os.remove(tmp)
                  except Exception as e:
                      print('convert fail',e)
                      try: os.rename(tmp,out)
                      except Exception: pass
              print(it['file'],r.stdout)
          PY
          done
      - name: Commit
        run: |
          git config user.name ffl-bot; git config user.email ffl-bot@users.noreply.github.com
          git add sheets && git commit -m "sheets" && for i in 1 2 3 4 5 6; do git pull --rebase -q && git push && break; sleep $((RANDOM%10+3)); done || echo nothing

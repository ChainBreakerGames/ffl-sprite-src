name: pull-from-autosprite
on:
  push:
    paths: ['dl/*.json']
permissions:
  contents: write
jobs:
  down:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download each URL
        run: |
          mkdir -p sheets
          for f in dl/*.json; do
            python3 - "$f" <<'PY'
          import json,sys,subprocess,os
          for it in json.load(open(sys.argv[1])):
              out='sheets/'+it['file']
              if os.path.exists(out): continue
              r=subprocess.run(['curl','-sL','-o',out,'-w','%{http_code}',it['url']],capture_output=True,text=True)
              print(it['file'],r.stdout)
          PY
          done
      - name: Commit
        run: |
          git config user.name ffl-bot; git config user.email ffl-bot@users.noreply.github.com
          git add sheets && git commit -m "sheets" && for i in 1 2 3 4 5 6; do git pull --rebase -q && git push && break; sleep $((RANDOM%10+3)); done || echo nothing
